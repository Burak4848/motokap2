name: MOTOKAP V14 deep live audit
on:
  push:
    branches:
      - release/motokap-v14-kontrol-20261120
    paths:
      - '.github/workflows/v14-deep-live-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all live pages and 84 assets
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, re, sys, time, xml.etree.ElementTree as ET
          from html import unescape
          base='https://www.motokap.com'
          assets=["/assets/motokap-v14/buyuk-boy/01-bmw-gs-studyo-sm.webp","/assets/motokap-v14/buyuk-boy/01-bmw-gs-studyo.webp","/assets/motokap-v14/buyuk-boy/02-touring-studyo-sm.webp","/assets/motokap-v14/buyuk-boy/02-touring-studyo.webp","/assets/motokap-v14/buyuk-boy/03-orta-buyuk-gercek-kullanim-sm.webp","/assets/motokap-v14/buyuk-boy/03-orta-buyuk-gercek-kullanim.webp","/assets/motokap-v14/buyuk-boy/04-goldwing-gercek-kullanim-yazili-sm.webp","/assets/motokap-v14/buyuk-boy/04-goldwing-gercek-kullanim-yazili.webp","/assets/motokap-v14/galeri-standart/buyuk-boy--01-bmw-gs-studyo.webp","/assets/motokap-v14/galeri-standart/buyuk-boy--02-touring-studyo.webp","/assets/motokap-v14/galeri-standart/buyuk-boy--03-orta-buyuk-gercek-kullanim.webp","/assets/motokap-v14/galeri-standart/buyuk-boy--04-goldwing-gercek-kullanim-yazili.webp","/assets/motokap-v14/galeri-standart/iki-motosiklet-atv--01-canam-studyo.webp","/assets/motokap-v14/galeri-standart/iki-motosiklet-atv--02-kapali-studyo.webp","/assets/motokap-v14/galeri-standart/iki-motosiklet-atv--03-iki-motosiklet-gercek-kullanim-yazili.webp","/assets/motokap-v14/galeri-standart/orta-boy--01-sr450-studyo.webp","/assets/motokap-v14/galeri-standart/orta-boy--02-mt07-studyo.webp","/assets/motokap-v14/galeri-standart/orta-boy--03-orta-buyuk-gercek-kullanim.webp","/assets/motokap-v14/galeri-standart/orta-boy--04-r7-gercek-kullanim-yazili.webp","/assets/motokap-v14/galeri-standart/ortak-teknik--01-miflonlu-deri-kumas.webp","/assets/motokap-v14/galeri-standart/ortak-teknik--02-cnc-celik-mekanizma.webp","/assets/motokap-v14/galeri-standart/ortak-teknik--03-miflonlu-ic-yuzey.webp","/assets/motokap-v14/galeri-standart/ortak-teknik--04-cirt-dikisli-baglantilar.webp","/assets/motokap-v14/hero/hero-mobil-buyuk-kapali-sm.webp","/assets/motokap-v14/hero/hero-mobil-buyuk-kapali.webp","/assets/motokap-v14/hero/hero-pc-orta-buyuk-sm.webp","/assets/motokap-v14/hero/hero-pc-orta-buyuk.webp","/assets/motokap-v14/iki-motosiklet-atv/01-canam-s