name: MOTOKAP V14 site QA
on:
  push:
    branches:
      - main
      - audit/v14-trafik-seo-20261120
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify all site routes and metadata
        run: python3 MOTOKAP/tools/v14_site_audit.py
      - name: Verify JavaScript parse
        run: |
          node --check MOTOKAP/public/site-v14.js
          node --check MOTOKAP/public/site-measurement-v14.js
          node --check MOTOKAP/public/content.js
          node --check MOTOKAP/public/runtime.js
          node --check MOTOKAP/public/sales.js

  live-http-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-site-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel production deployment
        run: |
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 20 https://www.motokap.com/site-measurement-v14.js | grep -q "motokap:fit_whatsapp_click"; then
              echo "V14 optimized production script visible"
              exit 0
            fi
            echo "Waiting for updated production site: $i/15"
            sleep 10
          done
          echo "Production V14 optimization not visible" >&2
          exit 1
      - name: Verify live HTTPS pages, migration redirects, images, and sitemap
        run: python3 MOTOKAP/tools/v14_live_smoke.py
