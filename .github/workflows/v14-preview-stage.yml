name: MOTOKAP V14 preview staging
on:
  push:
    branches:
      - release/motokap-v14-kontrol-20261120
    paths:
      - 'release-artifacts/v14-package.part*'
      - '.github/workflows/v14-preview-stage.yml'
permissions:
  contents: write
jobs:
  stage-v14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify ZIP and apply V14 overlay
        run: python3 tools/stage_v14.py
      - name: Validate JavaScript
        run: |
          node --check MOTOKAP/public/site-v14.js
          node --check MOTOKAP/public/site-measurement-v14.js
          node --check MOTOKAP/public/content.js
      - name: Commit preview changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f release-artifacts/v14-package.part*
          git add -A MOTOKAP/public MOTOKAP/vercel.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No site changes found"; exit 1; }
          git commit -m "feat: stage complete MOTOKAP V14 site with customer galleries"
          git push origin HEAD:refs/heads/release/motokap-v14-kontrol-20261120
